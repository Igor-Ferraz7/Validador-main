<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preenchedor de Remessa .srb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Mona+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<body>

<!-- Faixa do banco: diz para qual banco a remessa está sendo gerada e traz o
     botão de troca. Logo, nome e produto são preenchidos pelo script. -->
<header class="hero">
  <span class="hlogo"><img id="hLogo" src="" alt="" hidden></span>
  <div class="ht">
    <p class="hk">Preenchedor de remessa .srb · gerando para</p>
    <h1 id="hBanco">—</h1>
    <p class="hp" id="hProduto"></p>
  </div>
  <div class="bsw" id="bankSw">
    <button type="button" class="bsw-btn" id="bankBtn" aria-haspopup="true" aria-expanded="false" aria-controls="bankMenu">Trocar banco<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5 8 10.5l4-4"/></svg></button>
    <div class="bsw-menu" id="bankMenu" hidden></div>
  </div>
</header>

<div class="wrap">

  <!-- TEMPLATE CARREGADO -->
  <div class="fb hidden" id="fb">
    <span class="dot"></span>
    <span class="fn" id="fbName">—</span>
    <span class="fm" id="fbMeta"></span>
  </div>

  <!-- BANNERS -->
  <div id="bannerArea"></div>

  <!-- CAMPOS (um cartão por grupo) + barra fixa de progresso -->
  <div id="panel" class="hidden">
    <div id="rows"></div>

    <div class="genbar">
      <div class="gprog"><span id="progTxt"></span><i><b id="progBar"></b></i></div>
      <span class="gen-note" id="genNote"></span>
      <button class="btn-gen" id="btnGen" type="button" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>Gerar .srb</button>
    </div>
  </div>

</div>

<!-- Templates embutidos (gerados de Placeholders/ por tools/gerar-templates.ps1)
     e regras por banco. Para outro banco: adicione o .TXT em Placeholders/,
     rode o gerador e crie configs/<banco>.js com o <script> correspondente. -->
<script src="templates/templates.js"></script>
<script src="configs/bb.js"></script>
<script src="configs/bradesco.js"></script>
<script src="configs/caixa.js"></script>
<script src="configs/credisis.js"></script>
<script src="configs/itau.js"></script>
<script src="configs/santander.js"></script>
<script src="configs/sicoob.js"></script>
<script src="configs/sicredi.js"></script>

<script>
"use strict";

/* ===================== Estado ===================== */
var CONFIGS = window.SRB_CONFIGS || {};
var TEMPLATES = window.SRB_TEMPLATES || [];
var state = {
  cfg: null,            // config do banco do template selecionado
  originalBinary: '',   // template como latin1 (1 byte = 1 char), preserva bytes
  originalName: '',
  detected: {},         // token -> {count, minWidth, firstIndex}
  rows: []              // objetos de linha (estado + refs DOM)
};

var TOKEN_RE = /<\w+_InsertIA>/g;

/* ===================== Normalizadores (genéricos) ===================== */
function stripDiacritics(s){
  // NFD separa o caractere base do diacrítico (inclui a cedilha de ç);
  // removemos os sinais combinantes, então Ç/ç → C/c.
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
var NORMALIZERS = {
  trim: function(s){ return s.trim(); },
  digits: function(s){ return s.replace(/\D+/g,''); },
  // CNPJ pode ter letras (CNPJ alfanumérico); tira só a máscara e põe em maiúsculas.
  cpfcnpj: function(s){ return s.toUpperCase().replace(/[^0-9A-Z]+/g,''); },
  companyName: function(s){
    var t = s.trim();
    t = stripDiacritics(t);
    t = t.toUpperCase();
    t = t.replace(/[^A-Z0-9 .,\/-]/g,'');  // remove fora do conjunto permitido
    t = t.replace(/\s+/g,' ').trim();      // colapsa espaços
    return t;
  }
  // 'account' é tratado à parte (precisa devolver DV detectado)
};

// Conta: remove não-dígitos; se a entrada (trim) terminar em "-X"
// (hífen + exatamente 1 caractere), X é tratado como DV.
function normAccount(s){
  var t = String(s).trim();
  var dv = '';
  if(t.length >= 2 && t.charAt(t.length-2) === '-'){
    dv = t.charAt(t.length-1);
    t = t.slice(0, t.length-2);
  }
  t = t.replace(/\D+/g,'');
  return { value: t, dv: dv };
}

/* ===================== Derivações ===================== */
function deriveTipoInscricao(inscNorm){
  if(inscNorm.length === 11) return '1';
  if(inscNorm.length === 14) return '2';
  return '';
}

/* ===================== Validações CPF/CNPJ ===================== */
function validCPF(cpf){
  if(!/^\d{11}$/.test(cpf)) return false;
  if(/^(\d)\1{10}$/.test(cpf)) return false;
  var s=0,i,d1,d2;
  for(i=0;i<9;i++) s += parseInt(cpf.charAt(i),10)*(10-i);
  d1 = 11 - (s%11); if(d1>=10) d1=0;
  if(d1 !== parseInt(cpf.charAt(9),10)) return false;
  s=0;
  for(i=0;i<10;i++) s += parseInt(cpf.charAt(i),10)*(11-i);
  d2 = 11 - (s%11); if(d2>=10) d2=0;
  return d2 === parseInt(cpf.charAt(10),10);
}
// CNPJ numérico ou alfanumérico: 12 caracteres [0-9A-Z] + 2 dígitos
// verificadores. No DV cada caractere vale o código ASCII − 48 (regra da
// Receita Federal); para CNPJ só numérico o resultado é o mesmo de antes.
function validCNPJ(cnpj){
  if(!/^[0-9A-Z]{12}\d{2}$/.test(cnpj)) return false;
  if(/^(.)\1{13}$/.test(cnpj)) return false;
  function calc(len){
    var s=0,pos=len-7,i;
    for(i=0;i<len;i++){ s += (cnpj.charCodeAt(i)-48)*pos--; if(pos<2) pos=9; }
    var r = s%11; return r<2 ? 0 : 11-r;
  }
  if(calc(12) !== parseInt(cnpj.charAt(12),10)) return false;
  return calc(13) === parseInt(cnpj.charAt(13),10);
}

/* ===================== Utilidades ===================== */
function countOcc(text, sub){
  if(!sub) return 0;
  return text.split(sub).length - 1;
}
// codifica o valor (UTF-8) numa "binary string" (1 byte = 1 char)
function valueToBinary(str){
  var bytes = new TextEncoder().encode(str), s='', i;
  for(i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return s;
}
function binaryToBytes(bin){
  var out = new Uint8Array(bin.length), i;
  for(i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i) & 0xff;
  return out;
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

/* ===================== Parsing do arquivo ===================== */
function detectTokens(text){
  var counts = {}, m;
  TOKEN_RE.lastIndex = 0;
  while((m = TOKEN_RE.exec(text)) !== null){
    var name = m[0].slice(1, -1); // remove < >
    if(!counts[name]) counts[name] = { count:0, minWidth:Infinity, firstIndex:m.index };
    counts[name].count++;
  }
  // largura = POS_FIM - POS_INI + 1; usamos a MENOR entre as ocorrências
  var lines = text.split('\n'), li;
  for(li=0; li<lines.length; li++){
    var line = lines[li];
    if(line.indexOf('_InsertIA>') === -1) continue;
    // guarda a primeira linha de cada token (usada na prévia da tela)
    var m0 = line.match(/<\w+_InsertIA>/);
    var k0 = m0 ? m0[0].slice(1,-1) : '';
    if(counts[k0] && counts[k0].line === undefined) counts[k0].line = line.replace(/\r$/,'');
    var parts = line.split('|');
    if(parts.length < 13) continue;
    var ini = parseInt(parts[3],10), fim = parseInt(parts[4],10);
    if(isNaN(ini) || isNaN(fim)) continue;
    var w = fim - ini + 1;
    var lm = line.match(/<\w+_InsertIA>/);
    if(!lm) continue;
    var tk = lm[0].slice(1,-1);
    if(counts[tk] && w < counts[tk].minWidth) counts[tk].minWidth = w;
  }
  // fallback caso algum token não venha de linha estrutural
  Object.keys(counts).forEach(function(k){
    if(!isFinite(counts[k].minWidth)) counts[k].minWidth = 9999;
  });
  return counts;
}

/* ===================== Construção das linhas (UI) ===================== */
function fieldCfgFor(token){
  if(!state.cfg) return null;
  for(var i=0;i<state.cfg.fields.length;i++){
    if(state.cfg.fields[i].token === token) return state.cfg.fields[i];
  }
  return null;
}

function orderedTokens(){
  var seen = {}, list = [];
  // 1) ordem definida pela config
  if(state.cfg){
    state.cfg.fields.forEach(function(f){
      if(state.detected[f.token]){ list.push(f.token); seen[f.token]=true; }
    });
  }
  // 2) tokens detectados sem config, na ordem de aparição
  Object.keys(state.detected)
    .filter(function(t){ return !seen[t]; })
    .sort(function(a,b){ return state.detected[a].firstIndex - state.detected[b].firstIndex; })
    .forEach(function(t){ list.push(t); });
  return list;
}

// Grupo visual do campo. A config pode definir "grupo"; sem isso, os dados de
// identificação vão em "Titular" e os demais em "Conta bancária".
var GRUPO_TITULAR = { Inscricao_InsertIA:1, TipoInscricao_InsertIA:1, NomeEmpresa_InsertIA:1 };
function grupoDe(token, cfg){
  if(cfg && cfg.grupo) return cfg.grupo;
  if(!cfg) return 'Outros campos';
  return GRUPO_TITULAR[token] ? 'Titular' : 'Conta bancária';
}
// Colunas ocupadas na grade (de 6), proporcionais ao tamanho do campo no arquivo.
function spanDe(row){
  if(row.minWidth >= 25) return 6;
  if(row.isDerived || row.minWidth >= 14) return 3;
  return 2;
}

// Valor normalizado a partir do que está digitado, sem efeitos colaterais.
function normOnly(row){
  var raw = row.el.valInput.value;
  var normName = row.cfg ? row.cfg.normalizer : 'trim';
  if(normName === 'account') return normAccount(raw).value;
  return (NORMALIZERS[normName] || NORMALIZERS.trim)(raw);
}

// Prévia: a primeira linha do template que usa o token, já com o valor no
// lugar. Enquanto não há valor, mostra o próprio token.
function previewHtml(row, val){
  var i = row.line.indexOf(row.ph);
  if(i < 0) return '';
  return 'no arquivo: ' + esc(row.line.slice(0, i)) +
    (val === '' ? '<mark class="pend">' + esc(row.ph) + '</mark>' : '<mark>' + esc(val) + '</mark>') +
    esc(row.line.slice(i + row.ph.length));
}

function buildRows(){
  var rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';
  state.rows = [];
  var grids = {};   // grupo -> elemento .grid do cartão

  orderedTokens().forEach(function(token){
    var info = state.detected[token];
    var cfg = fieldCfgFor(token);
    var isDerived = !!(cfg && cfg.derived);
    var hasInput  = !(cfg && cfg.input === false);

    var row = {
      token: token,
      ph: '<' + token + '>',   // token substituído (fixo: só informativo na tela)
      line: info.line || '',   // primeira linha do template que usa o token
      minWidth: info.minWidth,
      count: info.count,
      cfg: cfg,
      isDerived: isDerived,
      hasInput: hasInput,
      raw: '',
      norm: '',
      detectedDv: '',     // DV extraído da conta no padrão "-X"
      dvMoved: false,     // DV foi movido automaticamente para o campo DV
      dvNote: '',         // aviso informativo (recalculado em recompute)
      conflictMsg: '',    // conflito conta×DV (recalculado em recompute)
      touched: false,
      valid: false,
      el: {}
    };

    // --- cartão do grupo ---
    var grupo = grupoDe(token, cfg);
    if(!grids[grupo]){
      var card = document.createElement('div');
      card.className = 'grp-card';
      card.innerHTML = '<div class="grp-title">' + esc(grupo) + '</div><div class="fgrid"></div>';
      rowsEl.appendChild(card);
      grids[grupo] = card.querySelector('.fgrid');
    }

    // --- DOM do campo ---
    var rootEl = document.createElement('div');
    rootEl.className = 'fld s' + spanDe(row);

    var label = cfg ? cfg.label : token;
    var obs   = cfg ? (cfg.obs || '') : '';
    var id    = 'f_' + token;
    var tag   = !cfg ? '<span class="tag-novalid">sem validação</span>' : '';

    rootEl.innerHTML =
      '<label class="lbl" for="' + id + '">' + esc(label) + tag + '</label>' +
      (hasInput
        ? '<input type="text" id="' + id + '" class="val-input" spellcheck="false" autocomplete="off">'
        : '<div class="fauto derived-val"></div>') +
      '<div class="msg val-msg"></div>' +
      (obs && hasInput ? '<div class="obs">' + esc(obs) + '</div>' : '') +
      '<div class="tokinfo">' +
        '<div>substitui ' + esc(row.ph) + ' · ' + info.count + '× · até ' + info.minWidth + ' caractere' + (info.minWidth === 1 ? '' : 's') + '</div>' +
        '<div class="pv"></div>' +
      '</div>';
    grids[grupo].appendChild(rootEl);

    row.el.root    = rootEl;
    row.el.valInput= rootEl.querySelector('.val-input');
    row.el.valMsg  = rootEl.querySelector('.val-msg');
    row.el.derived = rootEl.querySelector('.derived-val');
    row.el.pv      = rootEl.querySelector('.pv');

    if(row.el.valInput){
      // enquanto digita: só a prévia; a validação roda ao sair do campo
      row.el.valInput.addEventListener('input', function(){
        row.el.pv.innerHTML = previewHtml(row, normOnly(row));
      });
      row.el.valInput.addEventListener('blur', function(){
        row.touched = true;
        normalizeRow(row);
        recompute();
      });
    }

    state.rows = state.rows.concat([row]);
  });

  recompute();
}

/* ===================== Recálculo / validação ===================== */

function byteLen(s){ return new TextEncoder().encode(s).length; }

function findRow(token){
  for(var i=0;i<state.rows.length;i++) if(state.rows[i].token === token) return state.rows[i];
  return null;
}

function normalizeRow(row){
  if(!row.hasInput) return;
  var raw = row.el.valInput.value;
  row.raw = raw;
  var cfg = row.cfg;
  var normName = cfg ? cfg.normalizer : 'trim';

  if(normName === 'account'){
    var res = normAccount(raw);
    row.norm = res.value;
    if(res.dv !== row.detectedDv) row.dvMoved = false;
    row.detectedDv = res.dv;
    // DV vazio → recebe o DV detectado. Se já tiver valor diferente, o
    // conflito é apontado em recompute() e some assim que for resolvido
    // em qualquer um dos dois campos.
    var dvRow = (res.dv && cfg && cfg.dvToken) ? findRow(cfg.dvToken) : null;
    if(dvRow && dvRow.el.valInput && dvRow.el.valInput.value.trim() === ''){
      dvRow.el.valInput.value = res.dv;
      dvRow.touched = true;
      normalizeRow(dvRow);
      row.dvMoved = true;
    }
  } else {
    var fn = NORMALIZERS[normName] || NORMALIZERS.trim;
    row.norm = fn(raw);
  }
}

// Valida o VALOR da linha (o placeholder é validado à parte).
function validateRow(row){
  if(row.isDerived){
    if(row.norm === '') return { valid:false, level:'wa', msg:'Aguardando CPF/CNPJ válido na linha correspondente.' };
    if(byteLen(row.norm) > row.minWidth) return { valid:false, level:'er', msg:'Valor derivado excede a largura do campo (' + row.minWidth + ').' };
    return { valid:true, level:'ok', msg:'Valor derivado: "' + row.norm + '".' };
  }

  var v = row.norm || '';
  if(v === ''){
    return { valid:false, level: row.touched ? 'er' : 'in', msg: row.touched ? 'Informe um valor.' : 'Aguardando preenchimento.' };
  }
  if(row.conflictMsg){
    return { valid:false, level:'er', msg: row.conflictMsg };
  }
  // largura máxima (estrutural) vale para todos os tokens. POS_INI/POS_FIM
  // são posições em bytes, então medimos o valor já codificado.
  var bl = byteLen(v);
  if(bl > row.minWidth){
    return { valid:false, level:'er', msg:'Máximo de ' + row.minWidth + (row.minWidth === 1 ? ' caractere' : ' caracteres') + '; o valor informado tem ' + bl +
      (bl > v.length ? ' (caracteres acentuados/especiais ocupam mais de 1 byte).' : '.') };
  }

  var rule = row.cfg && row.cfg.rule;
  if(!rule){
    return { valid:true, level:'wa', msg:'Sem validação de conteúdo (limite de ' + row.minWidth + ' car. aplicado).' };
  }

  if(rule.kind === 'cpfcnpj'){
    if(v.length === 11){
      if(!/^\d{11}$/.test(v)) return { valid:false, level:'er', msg:'CPF tem só dígitos (letras só existem no CNPJ).' };
      return validCPF(v) ? {valid:true,level:'ok',msg:'CPF válido.'} : {valid:false,level:'er',msg:'CPF inválido (dígito verificador não confere).'};
    }
    if(v.length === 14){
      if(!/^[0-9A-Z]{12}\d{2}$/.test(v)) return { valid:false, level:'er', msg:'CNPJ: os 2 últimos caracteres (dígitos verificadores) são sempre números.' };
      var alfa = /[A-Z]/.test(v) ? ' alfanumérico' : '';
      if(alfa && !rule.alfanumerico) return { valid:false, level:'er', msg:'O manual do ' + (state.cfg ? state.cfg.name : 'banco') + ' ainda não aceita CNPJ com letras (CNPJ alfanumérico).' };
      return validCNPJ(v) ? {valid:true,level:'ok',msg:'CNPJ' + alfa + ' válido.'} : {valid:false,level:'er',msg:'CNPJ' + alfa + ' inválido (dígito verificador não confere).'};
    }
    return { valid:false, level:'er', msg:'Deve ter 11 (CPF) ou 14 (CNPJ) caracteres; atual: ' + v.length + '.' };
  }

  if(rule.kind === 'charset'){
    var min = rule.min || 1;
    if(v.length < min) return { valid:false, level:'er', msg:'Mínimo de ' + min + ' caractere(s).' };
    if(rule.charset === 'digits' && !/^\d+$/.test(v)) return { valid:false, level:'er', msg:'Use apenas dígitos.' };
    if(rule.charset === 'alnum'  && !/^[A-Za-z0-9]+$/.test(v)) return { valid:false, level:'er', msg:'Use apenas letras e números.' };
    if(rule.charset === 'company'&& !/^[A-Z0-9 .,\/-]+$/.test(v)) return { valid:false, level:'er', msg:'Caractere não permitido no nome.' };
    return { valid:true, level:'ok', msg:'OK.' };
  }
  return { valid:true, level:'ok', msg:'OK.' };
}

function updateRowDisplay(row, res){
  // prévia da linha no arquivo gerado
  row.el.pv.innerHTML = previewHtml(row, row.norm || '');

  // campo calculado automaticamente
  if(row.isDerived && row.el.derived){
    if(row.norm === ''){
      row.el.derived.textContent = 'Preenchido automaticamente a partir do CPF/CNPJ.';
    } else {
      var oQue = '';
      if(row.cfg.deriveKind === 'tipoInscricao') oQue = row.norm === '1' ? 'CPF — ' : 'CNPJ — ';
      row.el.derived.innerHTML = '<strong>' + esc(row.norm) + '</strong> ' + oQue + 'preenchido automaticamente';
    }
  }

  // mensagem de validação (+ aviso de DV, se houver). Campo vazio ainda não
  // tocado e campo calculado não mostram mensagem: a dica já explica.
  var texto = res.msg;
  if(res.level === 'in' || (row.isDerived && res.level !== 'er')) texto = '';
  else if(res.level === 'ok') texto = res.msg === 'OK.' ? '' : '✓ ' + res.msg;
  var msgEl = row.el.valMsg;
  msgEl.className = 'msg ' + res.level + ' val-msg';
  msgEl.innerHTML = (row.dvNote ? '<span class="msg in" style="display:block;margin-top:0">' + esc(row.dvNote) + '</span>' : '') + esc(texto);

  if(row.el.valInput){
    row.el.valInput.classList.toggle('err', res.level === 'er');
    row.el.valInput.classList.toggle('okv', res.level === 'ok');
  }
}

function recompute(){
  state.rows.forEach(function(r){ r.dvNote = ''; r.conflictMsg = ''; });

  // 1) conta × DV, a partir dos valores atuais dos dois campos
  state.rows.forEach(function(r){
    if(!r.detectedDv || !r.cfg || !r.cfg.dvToken) return;
    var dvRow = findRow(r.cfg.dvToken);
    if(!dvRow) return;
    var dvVal = dvRow.norm || '';
    var campo = (r.cfg.label || 'campo').toLowerCase();
    var campoDv = (dvRow.cfg && dvRow.cfg.label) || 'DV';
    if(dvVal === r.detectedDv){
      r.dvNote = r.dvMoved
        ? 'DV detectado e movido para o campo "' + campoDv + '" (' + r.detectedDv + ').'
        : 'DV detectado coincide com o campo "' + campoDv + '" (' + r.detectedDv + ').';
    } else if(dvVal !== ''){
      r.conflictMsg = 'Conflito: ' + campo + ' termina em "-' + r.detectedDv + '", mas o campo "' + campoDv + '" contém "' + dvVal +
        '". Ajuste um dos dois antes de gerar.';
      dvRow.conflictMsg = 'Conflito com ' + campo + ' (que termina em "-' + r.detectedDv + '").';
    }
  });

  // 2) derivados (dependem do valor normalizado de origem)
  state.rows.forEach(function(r){
    if(r.isDerived && r.cfg){
      var src = findRow(r.cfg.deriveFrom);
      var srcNorm = src ? (src.norm || '') : '';
      if(r.cfg.deriveKind === 'tipoInscricao') r.norm = deriveTipoInscricao(srcNorm);
    }
  });

  // 3) valida o valor de cada campo e atualiza a tela
  var prontos = 0, faltam = [];
  state.rows.forEach(function(r){
    var res = validateRow(r);
    r.valid = res.valid;
    updateRowDisplay(r, res);
    if(r.valid) prontos++;
    else if(!r.isDerived) faltam.push(r.cfg ? r.cfg.label : r.token);   // o calculado se resolve sozinho
  });

  // 4) barra de progresso e botão
  var total = state.rows.length;
  var allValid = total > 0 && prontos === total;
  document.getElementById('progTxt').textContent = prontos + ' de ' + total + ' campos prontos';
  document.getElementById('progBar').style.width = (total ? Math.round(prontos * 100 / total) : 0) + '%';
  document.getElementById('btnGen').disabled = !allValid;

  var note = document.getElementById('genNote');
  if(total === 0){
    note.textContent = '';
  } else if(allValid){
    note.className = 'gen-note';
    note.textContent = 'Tudo certo — pronto para gerar.';
  } else {
    var nomes = faltam.slice(0, 3).join(', ') + (faltam.length > 3 ? ' e mais ' + (faltam.length - 3) : '');
    note.className = 'gen-note blocked';
    note.textContent = faltam.length ? 'Falta' + (faltam.length > 1 ? 'm' : '') + ': ' + nomes : '';
  }
}


/* ===================== Geração / download ===================== */
function outName(name){
  var dot = name.lastIndexOf('.');
  if(dot <= 0) return name + '_preenchido';
  return name.slice(0,dot) + '_preenchido' + name.slice(dot);
}
function generate(){
  // normaliza tudo defensivamente a partir dos inputs atuais
  state.rows.forEach(function(r){ if(r.hasInput) normalizeRow(r); });
  recompute();
  if(document.getElementById('btnGen').disabled) return;

  // substitui placeholders mais longos primeiro (evita sobreposição de substrings)
  var subs = state.rows.map(function(r){
    return { ph: r.ph, val: valueToBinary(r.norm || '') };
  }).filter(function(s){ return s.ph; })
    .sort(function(a,b){ return b.ph.length - a.ph.length; });

  var out = state.originalBinary;
  subs.forEach(function(s){ out = out.split(s.ph).join(s.val); });

  var blob = new Blob([binaryToBytes(out)], { type:'application/octet-stream' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = outName(state.originalName);
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* ===================== Carregamento do template ===================== */
// Reconstrói o arquivo a partir de templates/templates.js como "binary
// string" latin1 (1 char = 1 byte), igual ao arquivo em Placeholders/.
function templateBinary(tpl){
  var eol = tpl.eol === 'CRLF' ? '\r\n' : '\n';
  return tpl.lines.join(eol) + (tpl.finalNewline ? eol : '');
}

// Contraste (WCAG) entre uma cor #RRGGBB e o branco.
function contrasteComBranco(hex){
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
  if(!m) return 21;
  var n = parseInt(m[1], 16);
  var lum = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function(v){
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 1.05 / (0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2] + 0.05);
}

// Cor da faixa do banco: escurece a cor da marca até o texto branco ter
// contraste de 4.5:1. Sem isso, bancos claros (o amarelo do BB) ficam ilegíveis.
function corDaFaixa(hex){
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
  if(!m) return hex;
  var n = parseInt(m[1], 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  var lin = function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  var contraste = function(k){ return 1.05 / (0.2126 * lin(r * k) + 0.7152 * lin(g * k) + 0.0722 * lin(b * k) + 0.05); };
  // começa em 0.92: a faixa fica sempre um pouco mais escura que a marca, para
  // o logo do banco não se fundir ao fundo
  var k = 0.92;
  while(k > 0.1 && contraste(k) < 4.5) k -= 0.05;
  var hx = function(v){ return ('0' + Math.round(v * k).toString(16)).slice(-2); };
  return '#' + hx(r) + hx(g) + hx(b);
}

// Identidade do banco do template: cabeçalho, cor de destaque e botão de manuais.
function aplicarBanco(code){
  var c = CONFIGS[code] || {};
  var nome = c.name || ('Banco ' + code);
  var logo = document.getElementById('hLogo');
  if(c.logo){ logo.src = c.logo; logo.alt = nome; logo.hidden = false; } else { logo.hidden = true; }
  document.getElementById('hBanco').textContent = nome + ' (' + code + ')';
  document.getElementById('hProduto').textContent = c.produto || '';
  if(c.cor){
    document.documentElement.style.setProperty('--bk', c.cor);
    document.documentElement.style.setProperty('--bkl', c.corClara || c.cor);
    document.documentElement.style.setProperty('--bkh', corDaFaixa(c.cor));
    // texto sobre a cor do banco: branco, ou a tinta quando o branco não dá contraste (4.5:1)
    document.documentElement.style.setProperty('--bkc', contrasteComBranco(c.cor) >= 4.5 ? '#fff' : '#16140f');
  }
  document.documentElement.setAttribute('data-banco', code);
  document.title = 'Preenchedor de Remessa .srb — ' + nome + ' ' + code;
  if(window.CnabDocs) window.CnabDocs.montar(code);
  if(window.CnabServicos) window.CnabServicos.montar(code);
}

function loadTemplate(tpl){
  aplicarBanco(tpl.bank);
  state.cfg = CONFIGS[tpl.bank] || null;
  state.originalName = tpl.fileName;
  state.originalBinary = templateBinary(tpl);
  state.rows = [];
  document.getElementById('rows').innerHTML = '';

  // Integridade: o template embutido precisa ter o tamanho registrado pelo gerador.
  if(state.originalBinary.length !== tpl.bytes){
    state.detected = {};
    document.getElementById('fb').classList.add('hidden');
    document.getElementById('panel').classList.add('hidden');
    document.getElementById('bannerArea').innerHTML =
      '<div class="banner"><span class="ic">!</span><div>O template <b>' + esc(tpl.fileName) + '</b> está corrompido (' +
      state.originalBinary.length + ' bytes; esperado ' + tpl.bytes + '). Rode <code>tools/gerar-templates.ps1</code> novamente.</div></div>';
    return;
  }

  state.detected = detectTokens(state.originalBinary);
  var nTokens = Object.keys(state.detected).length;
  var nLines = tpl.lines.length;

  document.getElementById('fb').classList.remove('hidden');
  document.getElementById('fbName').textContent = tpl.fileName;
  document.getElementById('fbMeta').textContent =
    tpl.bytes + ' bytes · ' + nLines + ' linhas ' + tpl.eol + ' · ' + nTokens + ' token(s) distinto(s)';

  showBanners();
  if(nTokens === 0){
    document.getElementById('panel').classList.add('hidden');
  } else {
    document.getElementById('panel').classList.remove('hidden');
    buildRows();
  }
}

function showBanners(){
  var area = document.getElementById('bannerArea');
  area.innerHTML = '';
  var nTokens = Object.keys(state.detected).length;
  if(nTokens === 0){
    area.innerHTML = '<div class="banner"><span class="ic">!</span><div>Nenhum placeholder <code>&lt;Campo_InsertIA&gt;</code> foi encontrado neste arquivo. Confira se é um template de remessa .srb.</div></div>';
    return;
  }
  // avisa sobre tokens detectados sem regra na config selecionada
  var unknown = Object.keys(state.detected).filter(function(t){ return !fieldCfgFor(t); });
  if(unknown.length){
    area.innerHTML = '<div class="banner"><span class="ic">!</span><div><b>' + unknown.length + ' token(s) sem regra de validação</b> para o banco selecionado: ' +
      unknown.map(function(t){ return '<code>&lt;'+esc(t)+'&gt;</code>'; }).join(', ') +
      '. Serão tratados como texto livre (apenas o limite de largura é aplicado).</div></div>';
  }
}

/* ===================== Inicialização ===================== */
(function init(){
  // Um item por template embutido, em ordem alfabética de banco. O nome do
  // arquivo só aparece se o banco tiver mais de um template.
  var sw = document.getElementById('bankSw');
  var btn = document.getElementById('bankBtn');
  var menu = document.getElementById('bankMenu');
  var perBank = {};
  var nomeBanco = function(t){ return CONFIGS[t.bank] ? CONFIGS[t.bank].name : 'Banco ' + t.bank; };
  TEMPLATES.forEach(function(t){ perBank[t.bank] = (perBank[t.bank] || 0) + 1; });
  var ordem = TEMPLATES.map(function(t, i){ return i; }).sort(function(a, b){
    return nomeBanco(TEMPLATES[a]).localeCompare(nomeBanco(TEMPLATES[b]), 'pt-BR') ||
      TEMPLATES[a].fileName.localeCompare(TEMPLATES[b].fileName);
  });
  function abrir(open){
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function marcar(i){
    [].forEach.call(menu.children, function(it){
      var on = it.getAttribute('data-i') === String(i);
      it.classList.toggle('on', on);
      if(on) it.setAttribute('aria-current', 'true'); else it.removeAttribute('aria-current');
    });
  }
  ordem.forEach(function(i){
    var t = TEMPLATES[i], c = CONFIGS[t.bank] || {};
    var detalhe = t.bank + (c.produto ? ' · ' + c.produto.split(' · ')[0] : '') + (perBank[t.bank] > 1 ? ' · ' + t.fileName : '');
    var it = document.createElement('button');
    it.type = 'button';
    it.className = 'bsw-item';
    it.setAttribute('data-i', String(i));
    it.innerHTML = '<span class="mlogo">' + (c.logo ? '<img src="' + c.logo + '" alt="">' : '') + '</span>' +
      '<span class="mt"><strong>' + esc(nomeBanco(t)) + '</strong><small>' + esc(detalhe) + '</small></span>';
    it.addEventListener('click', function(){
      abrir(false);
      btn.focus();
      marcar(i);
      loadTemplate(t);
      // Lembra o último template escolhido neste navegador (conveniência; pode faltar).
      try { localStorage.setItem('srb.template', t.fileName); } catch(e){}
    });
    menu.appendChild(it);
  });
  btn.addEventListener('click', function(){ abrir(menu.hidden); });
  // captura: fecha mesmo quando outro componente interrompe a propagação do clique
  document.addEventListener('click', function(e){ if(!sw.contains(e.target)) abrir(false); }, true);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') abrir(false); });
  document.getElementById('btnGen').addEventListener('click', generate);

  if(TEMPLATES.length){
    var salvo = null;
    try { salvo = localStorage.getItem('srb.template'); } catch(e){}
    var inicial = ordem.filter(function(i){ return TEMPLATES[i].fileName === salvo; })[0];
    if(inicial === undefined) inicial = ordem[0];
    marcar(inicial);
    loadTemplate(TEMPLATES[inicial]);
  } else {
    btn.disabled = true;
    document.getElementById('bannerArea').innerHTML =
      '<div class="banner"><span class="ic">!</span><div>Nenhum template configurado. Adicione o arquivo em <code>Placeholders/</code> e rode <code>tools/gerar-templates.ps1</code>.</div></div>';
  }
})();
</script>
