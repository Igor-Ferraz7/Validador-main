<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preenchedor de Remessa .srb — Santander 033</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bk:#EC0000;--bkl:#FF1A1A;
  --bg:#FBF2F2;--cd:#FFFFFF;--cd2:#FFF5F5;
  --br:#F2D5D5;--br2:#E8AAAA;
  --tx:#1A0505;--txd:#7A5555;--txm:#3D1515;
  --ok:#1A7A3C;--okb:rgba(26,122,60,.09);--okm:rgba(26,122,60,.30);
  --wa:#C07B00;--wab:rgba(192,123,0,.10);--wam:rgba(192,123,0,.30);
  --er:#C4202A;--erb:rgba(196,32,42,.10);--erm:rgba(196,32,42,.35);
  --in:#0068A5;--inb:rgba(0,104,165,.09);
  --mono:'Space Mono',monospace;--sans:'Outfit',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:var(--mono);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 110% -10%,rgba(236,0,0,.05),transparent 60%),radial-gradient(ellipse 60% 50% at -10% 110%,rgba(236,0,0,.03),transparent 60%);pointer-events:none;z-index:0;}

header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:64px;background:#fff;border-bottom:3px solid var(--bk);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.logo{display:flex;align-items:center;gap:16px;}
.lb{background:var(--bk);color:#fff;font-family:var(--sans);font-weight:800;font-size:14px;padding:6px 12px;border-radius:6px;display:flex;align-items:center;gap:8px;}
.bank-logo{width:24px;height:24px;object-fit:contain;background:#fff;padding:2px;border-radius:4px;}
.lt h1{font-family:var(--sans);font-weight:700;font-size:15px;line-height:1.1;}
.lt p{font-size:10px;color:var(--txd);letter-spacing:.07em;text-transform:uppercase;margin-top:2px;}
.htag{font-size:10px;color:var(--txd);border:1px solid var(--br);padding:4px 10px;border-radius:100px;letter-spacing:.06em;background:var(--bg);}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 24px 80px;}

.bankrow{display:flex;align-items:center;gap:12px;margin-bottom:20px;font-size:12px;color:var(--txm);}
.bankrow select{font-family:var(--mono);font-size:12px;padding:8px 12px;border:1px solid var(--br2);border-radius:8px;background:#fff;color:var(--tx);cursor:pointer;}
.bankrow label{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:10px;color:var(--txd);}

.fb{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--br);border-radius:10px;padding:12px 16px;margin-bottom:22px;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.fb .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;}
.fb .fn{font-weight:700;}
.fb .fm{color:var(--txd);}

.sec-title{font-family:var(--sans);font-weight:700;font-size:14px;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.sec-title .pill{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--bkl);color:#fff;border-radius:100px;padding:2px 9px;}

.thead,.trow{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;align-items:start;}
.thead{padding:0 4px 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txd);font-weight:700;}
.trow{background:var(--cd);border:1px solid var(--br);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.03);position:relative;}
.trow.row-er{border-color:var(--erm);background:linear-gradient(0deg,var(--erb),var(--erb)),var(--cd);}
.trow.row-derived{background:var(--cd2);}

.vhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.vhead .lbl{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--txm);}
.obs{font-size:10px;color:var(--txd);line-height:1.5;margin-top:6px;}
.tag-novalid{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--wa);background:var(--wab);border:1px solid var(--wam);border-radius:100px;padding:2px 8px;}
.tag-derived{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--in);background:var(--inb);border:1px solid rgba(0,104,165,.3);border-radius:100px;padding:2px 8px;}

.fld label{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--txd);margin-bottom:4px;font-weight:700;}
.fld input{width:100%;font-family:var(--mono);font-size:13px;padding:9px 11px;border:1px solid var(--br2);border-radius:8px;background:#fff;color:var(--tx);transition:border-color .15s,box-shadow .15s;}
.fld input:focus{outline:none;border-color:var(--bk);box-shadow:0 0 0 3px rgba(236,0,0,.08);}
.fld input.err{border-color:var(--er);box-shadow:0 0 0 3px var(--erb);}
.fld input.okv{border-color:var(--okm);}
.fld input:disabled{background:var(--bg);color:var(--txd);cursor:not-allowed;}

.count{font-size:10px;color:var(--txd);margin-top:5px;}
.count b{color:var(--txm);}
.preview{font-size:11px;margin-top:6px;color:var(--in);word-break:break-all;line-height:1.5;}
.preview .arrow{color:var(--txd);}
.preview code{font-family:var(--mono);background:var(--inb);padding:1px 6px;border-radius:4px;color:var(--txm);font-weight:700;}
.msg{font-size:10.5px;margin-top:6px;line-height:1.5;}
.msg.er{color:var(--er);font-weight:700;}
.msg.wa{color:var(--wa);}
.msg.ok{color:var(--ok);}
.msg.in{color:var(--in);}
.derived-val{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--in);padding:7px 0;}
.derived-val .empty{font-size:12px;color:var(--txd);font-weight:400;}

.summary{margin-top:8px;background:var(--cd);border:1px solid var(--br);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.summary .srow{display:grid;grid-template-columns:1.2fr 1.4fr 80px;gap:12px;padding:10px 16px;font-size:11.5px;border-top:1px solid var(--br);align-items:center;}
.summary .srow.head{background:var(--cd2);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--txd);font-weight:700;border-top:none;}
.summary .srow .tk{font-weight:700;color:var(--txm);word-break:break-all;}
.summary .srow .vv{color:var(--in);word-break:break-all;}
.summary .srow .vv.empty{color:var(--txd);font-style:italic;}
.summary .srow .nn{text-align:right;color:var(--txd);}
.summary .srow .nn b{color:var(--bk);}

.actions{display:flex;align-items:center;gap:16px;margin-top:24px;flex-wrap:wrap;}
.btn-gen{display:inline-flex;align-items:center;gap:9px;padding:13px 28px;background:var(--bk);color:#fff;border:none;border-radius:9px;font-family:var(--mono);font-weight:700;font-size:13px;cursor:pointer;transition:background .15s,opacity .15s;}
.btn-gen:hover:not(:disabled){background:var(--bkl);}
.btn-gen:disabled{opacity:.45;cursor:not-allowed;}
.gen-note{font-size:11px;color:var(--txd);}
.gen-note.blocked{color:var(--er);font-weight:700;}

.hidden{display:none !important;}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--erb);border:1px solid var(--erm);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:11.5px;color:var(--txm);line-height:1.5;}
.banner.ok{background:var(--okb);border-color:var(--okm);}
.banner .ic{font-weight:800;color:var(--er);}
.banner.ok .ic{color:var(--ok);}

@media(max-width:820px){
  .thead{display:none;}
  .trow{grid-template-columns:1fr;gap:12px;}
  .summary .srow{grid-template-columns:1fr;gap:4px;}
  .summary .srow .nn{text-align:left;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="lb">
      <img src="logos/Banco%20Santander%20Brasil%20S.A/santander-fundo-vermelho.svg" class="bank-logo" alt="Santander">
      Santander
    </div>
    <div class="lt">
      <h1>Preenchedor de Remessa .srb</h1>
      <p>Templates estruturais · Substituição de placeholders</p>
    </div>
  </div>
  <span class="htag">Banco 033 · Tokens &lt;Campo_InsertIA&gt; · Sem padding</span>
</header>

<div class="wrap">

  <div class="bankrow">
    <label for="bankSel">Banco</label>
    <select id="bankSel"></select>
    <span class="fm" style="color:var(--txd)">O template do banco já vem configurado — é só preencher os dados do cliente.</span>
  </div>

  <!-- TEMPLATE CARREGADO -->
  <div class="fb hidden" id="fb">
    <span class="dot"></span>
    <span class="fn" id="fbName">—</span>
    <span class="fm" id="fbMeta"></span>
  </div>

  <!-- BANNERS -->
  <div id="bannerArea"></div>

  <!-- TOKENS -->
  <div id="panel" class="hidden">
    <div class="sec-title">Placeholders detectados <span class="pill" id="tkCount">0</span></div>
    <div class="thead">
      <div>Placeholder</div>
      <div>Valor do cliente</div>
    </div>
    <div id="rows"></div>

    <div class="sec-title">Resumo da geração</div>
    <div class="summary" id="summary"></div>

    <div class="actions">
      <button class="btn-gen" id="btnGen" disabled>⤓ Gerar .srb</button>
      <span class="gen-note" id="genNote"></span>
    </div>
  </div>

</div>

<!-- Templates embutidos (gerados de Placeholders/ por tools/gerar-templates.ps1)
     e regras por banco. Para outro banco: adicione o .TXT em Placeholders/,
     rode o gerador e crie configs/<banco>.js com o <script> correspondente. -->
<script src="templates/templates.js"></script>
<script src="configs/santander.js"></script>

<script>
"use strict";

/* ===================== Estado ===================== */
var CONFIGS = window.SRB_CONFIGS || {};
var TEMPLATES = window.SRB_TEMPLATES || [];
var state = {
  cfg: null,            // config do banco do template selecionado
  originalBinary: '',   // template como latin1 (1 byte = 1 char), preserva bytes
  originalName: '',
  detected: {},         // token -> {count, minWidth, firstIndex}
  rows: []              // objetos de linha (estado + refs DOM)
};

var TOKEN_RE = /<\w+_InsertIA>/g;

/* ===================== Normalizadores (genéricos) ===================== */
function stripDiacritics(s){
  // NFD separa o caractere base do diacrítico (inclui a cedilha de ç);
  // removemos os sinais combinantes, então Ç/ç → C/c.
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
var NORMALIZERS = {
  trim: function(s){ return s.trim(); },
  digits: function(s){ return s.replace(/\D+/g,''); },
  cpfcnpj: function(s){ return s.replace(/\D+/g,''); },
  companyName: function(s){
    var t = s.trim();
    t = stripDiacritics(t);
    t = t.toUpperCase();
    t = t.replace(/[^A-Z0-9 .,\/-]/g,'');  // remove fora do conjunto permitido
    t = t.replace(/\s+/g,' ').trim();      // colapsa espaços
    return t;
  }
  // 'account' é tratado à parte (precisa devolver DV detectado)
};

// Conta: remove não-dígitos; se a entrada (trim) terminar em "-X"
// (hífen + exatamente 1 caractere), X é tratado como DV.
function normAccount(s){
  var t = String(s).trim();
  var dv = '';
  if(t.length >= 2 && t.charAt(t.length-2) === '-'){
    dv = t.charAt(t.length-1);
    t = t.slice(0, t.length-2);
  }
  t = t.replace(/\D+/g,'');
  return { value: t, dv: dv };
}

/* ===================== Derivações ===================== */
function deriveTipoInscricao(inscNorm){
  if(inscNorm.length === 11) return '1';
  if(inscNorm.length === 14) return '2';
  return '';
}

/* ===================== Validações CPF/CNPJ ===================== */
function validCPF(cpf){
  if(!/^\d{11}$/.test(cpf)) return false;
  if(/^(\d)\1{10}$/.test(cpf)) return false;
  var s=0,i,d1,d2;
  for(i=0;i<9;i++) s += parseInt(cpf.charAt(i),10)*(10-i);
  d1 = 11 - (s%11); if(d1>=10) d1=0;
  if(d1 !== parseInt(cpf.charAt(9),10)) return false;
  s=0;
  for(i=0;i<10;i++) s += parseInt(cpf.charAt(i),10)*(11-i);
  d2 = 11 - (s%11); if(d2>=10) d2=0;
  return d2 === parseInt(cpf.charAt(10),10);
}
function validCNPJ(cnpj){
  if(!/^\d{14}$/.test(cnpj)) return false;
  if(/^(\d)\1{13}$/.test(cnpj)) return false;
  function calc(len){
    var s=0,pos=len-7,i;
    for(i=0;i<len;i++){ s += parseInt(cnpj.charAt(i),10)*pos--; if(pos<2) pos=9; }
    var r = s%11; return r<2 ? 0 : 11-r;
  }
  if(calc(12) !== parseInt(cnpj.charAt(12),10)) return false;
  return calc(13) === parseInt(cnpj.charAt(13),10);
}

/* ===================== Utilidades ===================== */
function countOcc(text, sub){
  if(!sub) return 0;
  return text.split(sub).length - 1;
}
// codifica o valor (UTF-8) numa "binary string" (1 byte = 1 char)
function valueToBinary(str){
  var bytes = new TextEncoder().encode(str), s='', i;
  for(i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return s;
}
function binaryToBytes(bin){
  var out = new Uint8Array(bin.length), i;
  for(i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i) & 0xff;
  return out;
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

/* ===================== Parsing do arquivo ===================== */
function detectTokens(text){
  var counts = {}, m;
  TOKEN_RE.lastIndex = 0;
  while((m = TOKEN_RE.exec(text)) !== null){
    var name = m[0].slice(1, -1); // remove < >
    if(!counts[name]) counts[name] = { count:0, minWidth:Infinity, firstIndex:m.index };
    counts[name].count++;
  }
  // largura = POS_FIM - POS_INI + 1; usamos a MENOR entre as ocorrências
  var lines = text.split('\n'), li;
  for(li=0; li<lines.length; li++){
    var line = lines[li];
    if(line.indexOf('_InsertIA>') === -1) continue;
    var parts = line.split('|');
    if(parts.length < 13) continue;
    var ini = parseInt(parts[3],10), fim = parseInt(parts[4],10);
    if(isNaN(ini) || isNaN(fim)) continue;
    var w = fim - ini + 1;
    var lm = line.match(/<\w+_InsertIA>/);
    if(!lm) continue;
    var tk = lm[0].slice(1,-1);
    if(counts[tk] && w < counts[tk].minWidth) counts[tk].minWidth = w;
  }
  // fallback caso algum token não venha de linha estrutural
  Object.keys(counts).forEach(function(k){
    if(!isFinite(counts[k].minWidth)) counts[k].minWidth = 9999;
  });
  return counts;
}

/* ===================== Construção das linhas (UI) ===================== */
function fieldCfgFor(token){
  if(!state.cfg) return null;
  for(var i=0;i<state.cfg.fields.length;i++){
    if(state.cfg.fields[i].token === token) return state.cfg.fields[i];
  }
  return null;
}

function orderedTokens(){
  var seen = {}, list = [];
  // 1) ordem definida pela config
  if(state.cfg){
    state.cfg.fields.forEach(function(f){
      if(state.detected[f.token]){ list.push(f.token); seen[f.token]=true; }
    });
  }
  // 2) tokens detectados sem config, na ordem de aparição
  Object.keys(state.detected)
    .filter(function(t){ return !seen[t]; })
    .sort(function(a,b){ return state.detected[a].firstIndex - state.detected[b].firstIndex; })
    .forEach(function(t){ list.push(t); });
  return list;
}

function buildRows(){
  var rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';
  state.rows = [];

  var tokens = orderedTokens();
  document.getElementById('tkCount').textContent = String(tokens.length);

  tokens.forEach(function(token){
    var info = state.detected[token];
    var cfg = fieldCfgFor(token);
    var isDerived = !!(cfg && cfg.derived);
    var hasInput  = !(cfg && cfg.input === false);

    var row = {
      token: token,
      minWidth: info.minWidth,
      count: info.count,
      cfg: cfg,
      isDerived: isDerived,
      hasInput: hasInput,
      raw: '',
      norm: '',
      detectedDv: '',     // DV extraído da conta no padrão "-X"
      dvMoved: false,     // DV foi movido automaticamente para o campo DV
      dvNote: '',         // aviso informativo (recalculado em recompute)
      conflictMsg: '',    // conflito conta×DV (recalculado em recompute)
      phErr: '',          // erro do placeholder (recalculado em recompute)
      touched: false,
      valid: false,
      el: {}
    };

    // --- DOM da linha ---
    var rootEl = document.createElement('div');
    rootEl.className = 'trow' + (isDerived ? ' row-derived' : '');

    var label = cfg ? cfg.label : token;
    var obs   = cfg ? (cfg.obs || '') : '';
    var maxBadge = 'máx ' + info.minWidth + ' posição(ões) no arquivo';
    var tag = !cfg ? '<span class="tag-novalid">sem validação</span>'
            : (isDerived ? '<span class="tag-derived">derivado</span>' : '');

    // coluna 1 — PLACEHOLDER
    var phHtml =
      '<div class="fld">' +
        '<label>Token a substituir</label>' +
        '<input type="text" class="ph-input" spellcheck="false" value="' + esc('<'+token+'>') + '">' +
        '<div class="count ph-count"></div>' +
        '<div class="msg er ph-msg"></div>' +
      '</div>';

    // coluna 2 — VALOR DO CLIENTE
    var vhead = '<div class="vhead"><span class="lbl">' + esc(label) + '</span>' + tag + '</div>';
    var hint  = '<div class="obs">' + (obs ? esc(obs) + ' · ' : '') + maxBadge + '</div>';
    var valHtml;
    if(!hasInput){
      valHtml =
        '<div class="fld">' + vhead +
          '<div class="derived-val"><span class="empty">aguardando…</span></div>' +
          '<div class="msg val-msg"></div>' + hint +
        '</div>';
    } else {
      valHtml =
        '<div class="fld">' + vhead +
          '<input type="text" class="val-input" spellcheck="false" placeholder="digite ou cole o valor">' +
          '<div class="preview prev"></div>' +
          '<div class="msg val-msg"></div>' + hint +
        '</div>';
    }

    rootEl.innerHTML = phHtml + valHtml;
    rowsEl.appendChild(rootEl);

    row.el.root    = rootEl;
    row.el.phInput = rootEl.querySelector('.ph-input');
    row.el.phCount = rootEl.querySelector('.ph-count');
    row.el.phMsg   = rootEl.querySelector('.ph-msg');
    row.el.valInput= rootEl.querySelector('.val-input');
    row.el.prev    = rootEl.querySelector('.prev');
    row.el.valMsg  = rootEl.querySelector('.val-msg');
    row.el.derived = rootEl.querySelector('.derived-val');

    // eventos
    row.el.phInput.addEventListener('input', function(){
      recountPlaceholder(row);
      recompute();
    });
    if(row.el.valInput){
      row.el.valInput.addEventListener('blur', function(){
        row.touched = true;
        normalizeRow(row);
        recompute();
      });
    }

    state.rows = state.rows.concat([row]);
    recountPlaceholder(row);
  });

  recompute();
}

/* ===================== Recálculo / validação ===================== */
function recountPlaceholder(row){
  var ph = row.el.phInput.value;
  row.count = countOcc(state.originalBinary, ph);
  row.el.phCount.innerHTML = '<b>' + row.count + '</b> ocorrência' + (row.count===1?'':'s') + ' no arquivo';
}

// Erro do placeholder editado. Exigir o formato <Nome_InsertIA> e proibir
// duplicatas garante que só tokens sejam alterados na saída e que cada
// token detectado seja substituído exatamente uma vez.
function placeholderError(row){
  var ph = row.el.phInput.value;
  if(!/^<\w+_InsertIA>$/.test(ph)) return 'Formato inválido: use <Nome_InsertIA>.';
  if(row.count === 0) return 'Placeholder não encontrado no arquivo (0 ocorrências).';
  for(var i=0;i<state.rows.length;i++){
    var o = state.rows[i];
    if(o !== row && o.el.phInput.value === ph){
      return 'Placeholder duplicado: também usado em "' + (o.cfg ? o.cfg.label : o.token) + '".';
    }
  }
  return '';
}

function byteLen(s){ return new TextEncoder().encode(s).length; }

function findRow(token){
  for(var i=0;i<state.rows.length;i++) if(state.rows[i].token === token) return state.rows[i];
  return null;
}

function normalizeRow(row){
  if(!row.hasInput) return;
  var raw = row.el.valInput.value;
  row.raw = raw;
  var cfg = row.cfg;
  var normName = cfg ? cfg.normalizer : 'trim';

  if(normName === 'account'){
    var res = normAccount(raw);
    row.norm = res.value;
    if(res.dv !== row.detectedDv) row.dvMoved = false;
    row.detectedDv = res.dv;
    // DV vazio → recebe o DV detectado. Se já tiver valor diferente, o
    // conflito é apontado em recompute() e some assim que for resolvido
    // em qualquer um dos dois campos.
    var dvRow = (res.dv && cfg && cfg.dvToken) ? findRow(cfg.dvToken) : null;
    if(dvRow && dvRow.el.valInput && dvRow.el.valInput.value.trim() === ''){
      dvRow.el.valInput.value = res.dv;
      dvRow.touched = true;
      normalizeRow(dvRow);
      row.dvMoved = true;
    }
  } else {
    var fn = NORMALIZERS[normName] || NORMALIZERS.trim;
    row.norm = fn(raw);
  }
}

// Valida o VALOR da linha (o placeholder é validado à parte).
function validateRow(row){
  if(row.isDerived){
    if(row.norm === '') return { valid:false, level:'wa', msg:'Aguardando CPF/CNPJ válido na linha correspondente.' };
    if(byteLen(row.norm) > row.minWidth) return { valid:false, level:'er', msg:'Valor derivado excede a largura do campo (' + row.minWidth + ').' };
    return { valid:true, level:'ok', msg:'Valor derivado: "' + row.norm + '".' };
  }

  var v = row.norm || '';
  if(v === ''){
    return { valid:false, level: row.touched ? 'er' : 'in', msg: row.touched ? 'Informe um valor.' : 'Aguardando preenchimento.' };
  }
  if(row.conflictMsg){
    return { valid:false, level:'er', msg: row.conflictMsg };
  }
  // largura máxima (estrutural) vale para todos os tokens. POS_INI/POS_FIM
  // são posições em bytes, então medimos o valor já codificado.
  var bl = byteLen(v);
  if(bl > row.minWidth){
    return { valid:false, level:'er', msg:'Máximo de ' + row.minWidth + ' posição(ões); o valor normalizado ocupa ' + bl +
      (bl > v.length ? ' (caracteres acentuados/especiais ocupam mais de 1 byte).' : '.') };
  }

  var rule = row.cfg && row.cfg.rule;
  if(!rule){
    return { valid:true, level:'wa', msg:'Sem validação de conteúdo (limite de ' + row.minWidth + ' car. aplicado).' };
  }

  if(rule.kind === 'cpfcnpj'){
    if(v.length === 11) return validCPF(v) ? {valid:true,level:'ok',msg:'CPF válido.'} : {valid:false,level:'er',msg:'CPF inválido (dígito verificador não confere).'};
    if(v.length === 14) return validCNPJ(v) ? {valid:true,level:'ok',msg:'CNPJ válido.'} : {valid:false,level:'er',msg:'CNPJ inválido (dígito verificador não confere).'};
    return { valid:false, level:'er', msg:'Deve ter 11 (CPF) ou 14 (CNPJ) dígitos; atual: ' + v.length + '.' };
  }

  if(rule.kind === 'charset'){
    var min = rule.min || 1;
    if(v.length < min) return { valid:false, level:'er', msg:'Mínimo de ' + min + ' caractere(s).' };
    if(rule.charset === 'digits' && !/^\d+$/.test(v)) return { valid:false, level:'er', msg:'Use apenas dígitos.' };
    if(rule.charset === 'alnum'  && !/^[A-Za-z0-9]+$/.test(v)) return { valid:false, level:'er', msg:'Use apenas letras e números.' };
    if(rule.charset === 'company'&& !/^[A-Z0-9 .,\/-]+$/.test(v)) return { valid:false, level:'er', msg:'Caractere não permitido no nome.' };
    return { valid:true, level:'ok', msg:'OK.' };
  }
  return { valid:true, level:'ok', msg:'OK.' };
}

function updateRowDisplay(row, res){
  // preview do valor final (campos com input)
  if(row.hasInput && row.el.prev){
    if((row.raw || '').length === 0 && row.norm === ''){
      row.el.prev.innerHTML = '';
    } else {
      var pv = '<span class="arrow">→ será inserido:</span> <code>' + (row.norm === '' ? '(vazio)' : esc(row.norm)) + '</code>';
      if(row.detectedDv) pv += ' <span class="arrow">· DV detectado:</span> <code>' + esc(row.detectedDv) + '</code>';
      row.el.prev.innerHTML = pv;
    }
  }
  // derivados
  if(row.isDerived && row.el.derived){
    if(row.norm === ''){
      row.el.derived.innerHTML = '<span class="empty">aguardando…</span>';
    } else {
      row.el.derived.textContent = row.norm;
    }
  }
  // mensagem de validação do valor (+ aviso de DV, se houver)
  var msgEl = row.el.valMsg;
  if(msgEl){
    msgEl.className = 'msg ' + res.level + ' val-msg';
    msgEl.innerHTML = (row.dvNote ? '<span class="msg in" style="display:block;margin-top:0">' + esc(row.dvNote) + '</span>' : '') + esc(res.msg);
  }
  // erro do placeholder (coluna 1)
  row.el.phMsg.textContent = row.phErr;
  row.el.phInput.classList.toggle('err', !!row.phErr);
  // estados visuais
  row.el.root.classList.toggle('row-er', res.level === 'er' || !!row.phErr);
  if(row.el.valInput){
    row.el.valInput.classList.toggle('err', res.level === 'er');
    row.el.valInput.classList.toggle('okv', res.level === 'ok');
  }
}

function recompute(){
  state.rows.forEach(function(r){ r.dvNote = ''; r.conflictMsg = ''; });

  // 1) conta × DV, a partir dos valores atuais dos dois campos
  state.rows.forEach(function(r){
    if(!r.detectedDv || !r.cfg || !r.cfg.dvToken) return;
    var dvRow = findRow(r.cfg.dvToken);
    if(!dvRow) return;
    var dvVal = dvRow.norm || '';
    if(dvVal === r.detectedDv){
      r.dvNote = r.dvMoved
        ? 'DV detectado e movido para o campo próprio (DV = "' + r.detectedDv + '").'
        : 'DV detectado coincide com o campo DV ("' + r.detectedDv + '").';
    } else if(dvVal !== ''){
      r.conflictMsg = 'Conflito: a conta termina em "-' + r.detectedDv + '", mas o campo DV contém "' + dvVal +
        '". Ajuste a conta ou o DV antes de gerar.';
      dvRow.conflictMsg = 'Conflito com a conta (que termina em "-' + r.detectedDv + '").';
    }
  });

  // 2) derivados (dependem do valor normalizado de origem)
  state.rows.forEach(function(r){
    if(r.isDerived && r.cfg){
      var src = findRow(r.cfg.deriveFrom);
      var srcNorm = src ? (src.norm || '') : '';
      if(r.cfg.deriveKind === 'tipoInscricao') r.norm = deriveTipoInscricao(srcNorm);
    }
  });

  // 3) valida placeholder + valor de cada linha e atualiza UI
  var allValid = state.rows.length > 0;
  state.rows.forEach(function(r){
    r.phErr = placeholderError(r);
    var res = validateRow(r);
    r.valid = res.valid && !r.phErr;
    updateRowDisplay(r, res);
    if(!r.valid) allValid = false;
  });

  updateSummary();

  var btn = document.getElementById('btnGen');
  var note = document.getElementById('genNote');
  btn.disabled = !allValid;
  if(state.rows.length === 0){
    note.textContent = '';
  } else if(allValid){
    note.className = 'gen-note';
    note.textContent = 'Tudo certo — pronto para gerar.';
  } else {
    note.className = 'gen-note blocked';
    note.textContent = 'Geração bloqueada: existem campos pendentes ou inválidos.';
  }
}

function updateSummary(){
  var el = document.getElementById('summary');
  var html = '<div class="srow head"><div>Token / Placeholder</div><div>Valor normalizado</div><div class="nn">Subst.</div></div>';
  state.rows.forEach(function(r){
    var ph = r.el.phInput.value;
    var val = r.norm;
    var valCls = val === '' ? 'vv empty' : 'vv';
    var valTxt = val === '' ? '(pendente)' : esc(val);
    html += '<div class="srow">' +
      '<div class="tk">' + esc(ph) + '</div>' +
      '<div class="' + valCls + '">' + valTxt + '</div>' +
      '<div class="nn"><b>' + r.count + '</b></div>' +
    '</div>';
  });
  el.innerHTML = html;
}

/* ===================== Geração / download ===================== */
function outName(name){
  var dot = name.lastIndexOf('.');
  if(dot <= 0) return name + '_preenchido';
  return name.slice(0,dot) + '_preenchido' + name.slice(dot);
}
function generate(){
  // normaliza tudo defensivamente a partir dos inputs atuais
  state.rows.forEach(function(r){ if(r.hasInput) normalizeRow(r); });
  recompute();
  if(document.getElementById('btnGen').disabled) return;

  // substitui placeholders mais longos primeiro (evita sobreposição de substrings)
  var subs = state.rows.map(function(r){
    return { ph: r.el.phInput.value, val: valueToBinary(r.norm || '') };
  }).filter(function(s){ return s.ph; })
    .sort(function(a,b){ return b.ph.length - a.ph.length; });

  var out = state.originalBinary;
  subs.forEach(function(s){ out = out.split(s.ph).join(s.val); });

  var blob = new Blob([binaryToBytes(out)], { type:'application/octet-stream' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = outName(state.originalName);
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* ===================== Carregamento do template ===================== */
// Reconstrói o arquivo a partir de templates/templates.js como "binary
// string" latin1 (1 char = 1 byte), igual ao arquivo em Placeholders/.
function templateBinary(tpl){
  var eol = tpl.eol === 'CRLF' ? '\r\n' : '\n';
  return tpl.lines.join(eol) + (tpl.finalNewline ? eol : '');
}

function loadTemplate(tpl){
  state.cfg = CONFIGS[tpl.bank] || null;
  state.originalName = tpl.fileName;
  state.originalBinary = templateBinary(tpl);
  state.rows = [];
  document.getElementById('rows').innerHTML = '';

  // Integridade: o template embutido precisa ter o tamanho registrado pelo gerador.
  if(state.originalBinary.length !== tpl.bytes){
    state.detected = {};
    document.getElementById('fb').classList.add('hidden');
    document.getElementById('panel').classList.add('hidden');
    document.getElementById('bannerArea').innerHTML =
      '<div class="banner"><span class="ic">!</span><div>O template <b>' + esc(tpl.fileName) + '</b> está corrompido (' +
      state.originalBinary.length + ' bytes; esperado ' + tpl.bytes + '). Rode <code>tools/gerar-templates.ps1</code> novamente.</div></div>';
    return;
  }

  state.detected = detectTokens(state.originalBinary);
  var nTokens = Object.keys(state.detected).length;
  var nLines = tpl.lines.length;

  document.getElementById('fb').classList.remove('hidden');
  document.getElementById('fbName').textContent = tpl.fileName;
  document.getElementById('fbMeta').textContent =
    tpl.bytes + ' bytes · ' + nLines + ' linhas ' + tpl.eol + ' · ' + nTokens + ' token(s) distinto(s)';

  showBanners();
  if(nTokens === 0){
    document.getElementById('panel').classList.add('hidden');
  } else {
    document.getElementById('panel').classList.remove('hidden');
    buildRows();
  }
}

function showBanners(){
  var area = document.getElementById('bannerArea');
  area.innerHTML = '';
  var nTokens = Object.keys(state.detected).length;
  if(nTokens === 0){
    area.innerHTML = '<div class="banner"><span class="ic">!</span><div>Nenhum placeholder <code>&lt;Campo_InsertIA&gt;</code> foi encontrado neste arquivo. Confira se é um template de remessa .srb.</div></div>';
    return;
  }
  // avisa sobre tokens detectados sem regra na config selecionada
  var unknown = Object.keys(state.detected).filter(function(t){ return !fieldCfgFor(t); });
  if(unknown.length){
    area.innerHTML = '<div class="banner"><span class="ic">!</span><div><b>' + unknown.length + ' token(s) sem regra de validação</b> para o banco selecionado: ' +
      unknown.map(function(t){ return '<code>&lt;'+esc(t)+'&gt;</code>'; }).join(', ') +
      '. Serão tratados como texto livre (apenas o limite de largura é aplicado).</div></div>';
  }
}

/* ===================== Inicialização ===================== */
(function init(){
  // Um item por template embutido. O nome do banco vem da config; o nome do
  // arquivo só aparece se o banco tiver mais de um template.
  var sel = document.getElementById('bankSel');
  var perBank = {};
  TEMPLATES.forEach(function(t){ perBank[t.bank] = (perBank[t.bank] || 0) + 1; });
  TEMPLATES.forEach(function(t, i){
    var opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = (CONFIGS[t.bank] ? CONFIGS[t.bank].name : 'Banco') + ' (' + t.bank + ')' +
      (perBank[t.bank] > 1 ? ' — ' + t.fileName : '');
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function(){ loadTemplate(TEMPLATES[+sel.value]); });
  document.getElementById('btnGen').addEventListener('click', generate);

  if(TEMPLATES.length){
    loadTemplate(TEMPLATES[0]);
  } else {
    sel.disabled = true;
    document.getElementById('bannerArea').innerHTML =
      '<div class="banner"><span class="ic">!</span><div>Nenhum template configurado. Adicione o arquivo em <code>Placeholders/</code> e rode <code>tools/gerar-templates.ps1</code>.</div></div>';
  }
})();
</script>
