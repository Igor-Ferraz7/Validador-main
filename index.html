<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central CNAB240</title>
<meta name="description" content="Validador de remessa CNAB240 (o banco é reconhecido pelo arquivo), Analisador de retorno e Preenchedor de remessa .srb. Os arquivos são lidos só no navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Mona+Sans:wght@300..800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg">
<script src="assets/tema.js"></script>
<link rel="stylesheet" href="assets/ui.css">
<style>
  /* Casca da central: cabeçalho flutuante + página da ferramenta num iframe.
     Cores e tipos vêm de assets/ui.css; o --bk acompanha a página aberta. */
  html,body{height:100%;}
  body{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;min-height:0;overflow:hidden;font-size:15px;transition:background-color .3s var(--ease);}

  .topo{position:relative;z-index:20;width:100%;max-width:1240px;margin:12px auto 0;padding:0 16px;}
  .topo__in{display:flex;align-items:center;gap:28px;height:60px;padding:0 10px 0 20px;border-radius:16px;background:color-mix(in srgb,var(--cd) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in srgb,var(--tx) 7%,transparent);}
  .marca{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap;color:var(--tx);text-decoration:none;border-radius:8px;}
  .marca svg{width:22px;height:22px;flex-shrink:0;}
  .links{display:flex;gap:6px;}
  .grupo{position:relative;}
  .grupo>button{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--txm);font-size:15px;font-weight:500;transition:background-color .15s,color .15s;}
  .grupo>button:hover,.grupo>button[aria-expanded="true"]{color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent);}
  .grupo>button.atual{color:var(--tx);}
  .grupo>button svg{width:10px;height:10px;transition:transform .2s var(--ease);}
  .grupo>button[aria-expanded="true"] svg{transform:rotate(180deg);}
  .painel{position:absolute;left:0;top:calc(100% + 10px);width:340px;max-height:min(70vh,560px);overflow:auto;padding:8px;border-radius:16px;background:var(--cd);border:1px solid var(--br2);box-shadow:0 20px 50px rgba(0,0,0,.16);}
  .painel[hidden]{display:none;}
  .item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:12px;color:var(--tx);text-decoration:none;}
  .item:hover{background:var(--cd2);}
  .item[aria-current="page"]{background:var(--bg);}
  .item img,.item .ic{width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0;}
  .item .ic{display:grid;place-items:center;background:var(--tx);color:var(--cd);}
  .item .ic svg{width:17px;height:17px;}
  .item b{display:block;font-weight:600;font-size:15px;}
  .item small{display:block;font-size:13px;color:var(--txd);line-height:1.4;margin-top:1px;}
  .man{padding:10px 12px;border-radius:12px;}
  .man+.man{border-top:1px solid var(--br);border-radius:0;}
  .man h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
  .man h3 small{font:400 12px var(--mono);color:var(--txd);}
  .man a{display:block;margin-top:6px;font-size:13px;color:var(--txm);text-decoration:underline;text-decoration-color:var(--br2);text-underline-offset:3px;}
  .man a:hover{color:var(--tx);text-decoration-color:currentColor;}
  .man p{font-size:12px;color:var(--txd);margin-top:2px;}

  .acoes{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .pl{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:500;border:1px solid var(--tx);background:transparent;color:var(--tx);white-space:nowrap;text-decoration:none;transition:transform .15s var(--ease),background-color .15s;}
  .pl:hover{background:color-mix(in srgb,var(--tx) 6%,transparent);}
  .pl:active{transform:scale(.98);}
  .pl--dark{background:var(--tx);color:var(--bg);}
  .pl--dark:hover{background:var(--tx);}
  .pl svg{width:15px;height:15px;}
  .menu-btn{display:none;}

  .content{min-width:0;min-height:0;}
  .content iframe{display:block;width:100%;height:100%;border:0;background:transparent;}

  /* celular e tablet: menu em folha */
  .folha{display:none;}
  @media(max-width:1000px){
    .links{display:none;}
    .menu-btn{display:inline-flex;}
    .folha:not([hidden]){display:block;position:absolute;left:16px;right:16px;top:calc(100% + 10px);max-height:calc(100dvh - 100px);overflow:auto;padding:8px;border-radius:16px;background:var(--cd);border:1px solid var(--br2);box-shadow:0 20px 50px rgba(0,0,0,.18);}
    .folha h2{padding:12px 12px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txd);}
    .folha details{padding:0 0 4px;}
    .folha summary{padding:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txd);cursor:pointer;}
    .folha .tema-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;margin-top:4px;border-top:1px solid var(--br);font-size:14px;color:var(--txm);}
  }
  @media(max-width:640px){
    .topo{margin-top:8px;padding:0 8px;}
    .topo__in{gap:10px;padding:0 8px 0 14px;height:56px;}
    .acoes .tema{display:none;}
    .acoes .pl{height:38px;padding:0 14px;font-size:14px;}
    .folha:not([hidden]){left:8px;right:8px;}
    .so-largo{display:none;}
  }
  @media(max-width:420px){
    .marca .so-largo{display:none;}
  }
  @media(min-width:421px){
    .marca .so-largo{display:inline;}
  }
</style>
</head>
<body>

<div class="topo" id="topo" role="banner">
  <div class="topo__in">
    <a class="marca" href="#validar"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="9.5"/><path d="M6.8 11.3l2.8 2.7 5.6-6"/></svg><span><span class="so-largo">Central </span>CNAB</span></a>
    <nav class="links" aria-label="Ferramentas da central">
      <div class="grupo">
        <button type="button" aria-expanded="false" aria-controls="p-val" data-grupo="val">Validadores<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 3.5l3 3 3-3"/></svg></button>
        <div class="painel" id="p-val" hidden></div>
      </div>
      <div class="grupo">
        <button type="button" aria-expanded="false" aria-controls="p-fer" data-grupo="fer">Ferramentas<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 3.5l3 3 3-3"/></svg></button>
        <div class="painel" id="p-fer" hidden></div>
      </div>
      <div class="grupo">
        <button type="button" aria-expanded="false" aria-controls="p-man" data-grupo="man">Manuais<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 3.5l3 3 3-3"/></svg></button>
        <div class="painel" id="p-man" hidden></div>
      </div>
    </nav>
    <div class="acoes">
      <button class="pl tema" type="button" id="tema">Tema escuro</button>
      <button class="pl menu-btn" type="button" id="menuBtn" aria-expanded="false" aria-controls="folha">Menu</button>
      <button class="pl pl--dark" type="button" id="validarArq"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M4.5 6 8 2.5 11.5 6M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>Validar<span class="so-largo"> arquivo</span></button>
    </div>
  </div>
  <div class="folha" id="folha" hidden></div>
</div>

<main class="content">
  <iframe id="viewer" title="Ferramenta selecionada"></iframe>
</main>

<input type="file" id="arq" accept=".rem,.REM,.txt,.TXT,.ret,.RET" hidden>

<script src="docs/cnab/catalogo.js"></script>
<script>
(function () {
  var CHAVE = 'cnab.central.ultima';
  var VALIDADOR = 'Validador_CNAB240.html';
  var IC_ARQ = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 1.5h-5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-9l-3-3Z"/><path d="M9.5 1.5v3h3M6 8.5h4M6 11h4"/></svg>';
  var IC_RET = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v2.5H11"/></svg>';

  // Ferramentas: endereço na central → página e grupo do menu.
  var ROTAS = {
    validar:     { src: VALIDADOR, nome: 'Validar remessa', grupo: 'val', desc: 'O banco é reconhecido pelo header do arquivo', ic: IC_ARQ },
    retorno:     { src: 'Retorno_CNAB240.html', nome: 'Analisador de retorno', grupo: 'val', desc: 'Crítica ou movimento, e o status de cada pagamento', ic: IC_RET },
    preenchedor: { src: 'Preenchedor_SRB.html', nome: 'Preenchedor .srb', grupo: 'fer', desc: 'Gera o .srb a partir do template do banco', img: 'logos/srb-icon.svg' }
  };
  // Endereços antigos, de quando cada banco tinha a sua página: abrem o validador
  // único com o banco já escolhido (usado se o header do arquivo não disser qual é).
  var ANTIGOS = { bb: '001', santander: '033', bradesco: '237', itau: '341', sicredi: '748', sicoob: '756' };

  var viewer = document.getElementById('viewer');
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  /* ---------- menus ---------- */
  function itens(grupo) {
    return Object.keys(ROTAS).filter(function (k) { return ROTAS[k].grupo === grupo; }).map(function (k) {
      var r = ROTAS[k];
      return '<a class="item" href="#' + k + '" data-rota="' + k + '">' + (r.img ? '<img src="' + r.img + '" alt="">' : '<span class="ic">' + r.ic + '</span>') +
        '<span><b>' + esc(r.nome) + '</b><small>' + esc(r.desc) + '</small></span></a>';
    }).join('');
  }
  function manuais() {
    var cat = window.CNAB_DOCS;
    if (!cat) return '<p class="man">Catálogo de manuais não encontrado.</p>';
    var local = location.protocol === 'file:';
    return cat.bancos.concat(cat.referencias || []).map(function (b) {
      return '<div class="man"><h3>' + esc(b.nome) + (b.codigo ? ' <small>' + esc(b.codigo) + '</small>' : '') + '</h3>' +
        b.documentos.map(function (d) {
          return '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.titulo) + ' ↗</a>' +
            '<p>' + esc([d.versao ? 'versão ' + d.versao : '', d.data].filter(Boolean).join(' · ')) +
            (local ? ' · <a style="display:inline" href="docs/cnab/' + encodeURIComponent(b.pasta) + '/' + encodeURIComponent(d.arquivo) + '" target="_blank">cópia local</a>' : '') + '</p>';
        }).join('') + '</div>';
    }).join('') + '<p class="man" style="font-size:12px;color:var(--txd)">Catálogo atualizado em ' + esc(cat.atualizadoEm) + '</p>';
  }
  $('p-val').innerHTML = itens('val');
  $('p-fer').innerHTML = itens('fer');
  $('p-man').innerHTML = manuais();
  $('p-man').style.width = '400px';
  $('folha').innerHTML = '<h2>Validadores</h2>' + itens('val') + '<h2>Ferramentas</h2>' + itens('fer') +
    '<details><summary>Manuais oficiais</summary>' + manuais() + '</details>' +
    '<div class="tema-linha">Tema<button class="pl" type="button" id="temaFolha">Tema escuro</button></div>';

  var grupos = Array.prototype.slice.call(document.querySelectorAll('[data-grupo]'));
  function fecharTudo(exceto) {
    grupos.forEach(function (g) {
      if (g === exceto) return;
      g.setAttribute('aria-expanded', 'false');
      $(g.getAttribute('aria-controls')).hidden = true;
    });
    if (exceto !== $('menuBtn')) { $('folha').hidden = true; $('menuBtn').setAttribute('aria-expanded', 'false'); }
  }
  grupos.forEach(function (g) {
    g.addEventListener('click', function (e) {
      e.stopPropagation();
      var abrir = g.getAttribute('aria-expanded') !== 'true';
      fecharTudo(g);
      g.setAttribute('aria-expanded', String(abrir));
      $(g.getAttribute('aria-controls')).hidden = !abrir;
    });
  });
  $('menuBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var abrir = $('folha').hidden;
    fecharTudo($('menuBtn'));
    $('folha').hidden = !abrir;
    $('menuBtn').setAttribute('aria-expanded', String(abrir));
  });
  $('topo').addEventListener('click', function (e) {
    if (e.target.closest('.item')) fecharTudo();
    else if (e.target.closest('.painel,.folha')) e.stopPropagation();
  });
  document.addEventListener('click', function () { fecharTudo(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharTudo(); });
  window.addEventListener('blur', function () { fecharTudo(); }); // clique dentro do iframe

  /* ---------- rotas ---------- */
  function abrir(id) {
    var banco = ANTIGOS[id];
    var r = ROTAS[banco ? 'validar' : id];
    var chave = banco ? 'validar' : id;
    var src = r.src + (banco ? '#banco=' + banco : '');
    document.querySelectorAll('[data-rota]').forEach(function (a) {
      if (a.getAttribute('data-rota') === chave) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    grupos.forEach(function (g) { g.classList.toggle('atual', g.getAttribute('data-grupo') === r.grupo); });
    viewer.title = r.nome;
    document.title = r.nome + ' · Central CNAB240';
    if (viewer.getAttribute('data-atual') !== src) {
      viewer.setAttribute('data-atual', src);
      pronto = false;
      // location.replace: o botão Voltar do navegador anda uma ferramenta por vez
      try { viewer.contentWindow.location.replace(src); } catch (e) { viewer.src = src; }
    }
    try { localStorage.setItem(CHAVE, id); } catch (e) {}
  }
  function rota() {
    var id = location.hash.slice(1);
    if (id === 'retorno-santander') id = 'retorno';
    if (!ROTAS[id] && !ANTIGOS[id]) {
      var ultima = null;
      try { ultima = localStorage.getItem(CHAVE); } catch (e) {}
      id = ROTAS[ultima] || ANTIGOS[ultima] ? ultima : 'validar';
    }
    abrir(id);
  }

  /* ---------- "Validar arquivo": lê aqui e entrega ao validador ---------- */
  var pronto = false, pendente = null;
  viewer.addEventListener('load', function () {
    pronto = true;
    avisarTema();
    if (pendente && (viewer.getAttribute('data-atual') || '').indexOf(VALIDADOR) === 0) { entregar(pendente); pendente = null; }
  });
  function entregar(a) { try { viewer.contentWindow.postMessage({ cnabArquivo: a }, '*'); } catch (e) {} }
  $('validarArq').addEventListener('click', function () { $('arq').click(); });
  $('arq').addEventListener('change', function () {
    var f = this.files[0]; this.value = '';
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var a = { nome: f.name, bytes: f.size, texto: String(rd.result) };
      var noValidador = (viewer.getAttribute('data-atual') || '').indexOf(VALIDADOR) === 0;
      if (noValidador && pronto) entregar(a);
      else { pendente = a; location.hash = 'validar'; }
    };
    rd.readAsText(f, 'ISO-8859-1');
  });

  /* ---------- tema e cor ---------- */
  function rotuloTema() {
    var t = window.CnabTema ? window.CnabTema.atual() : 'light';
    var txt = t === 'dark' ? 'Tema claro' : 'Tema escuro';
    $('tema').textContent = txt; var tf = $('temaFolha'); if (tf) tf.textContent = txt;
  }
  function avisarTema() {
    try { viewer.contentWindow.postMessage({ cnabTema: window.CnabTema.atual() }, '*'); } catch (e) {}
  }
  if (window.CnabTema) {
    $('tema').addEventListener('click', function () { window.CnabTema.alternar(); });
    $('temaFolha').addEventListener('click', function () { window.CnabTema.alternar(); });
    window.CnabTema.aoMudar(function () { rotuloTema(); avisarTema(); });
    rotuloTema();
  }
  // A página aberta avisa a cor do banco (assets/tema.js); o fundo em volta acompanha.
  window.addEventListener('message', function (e) {
    var c = e.data && e.data.cnabCor;
    if (typeof c === 'string' && /^#[0-9a-f]{3,8}$|^rgb/i.test(c)) document.documentElement.style.setProperty('--bk', c);
  });

  window.addEventListener('hashchange', rota);
  rota();
})();
</script>

</body>
</html>
